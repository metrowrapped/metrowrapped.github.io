async function api(path,options={}){
  const {data:{session}}=await sb.auth.getSession();

  if(!session?.access_token){
    throw new Error("Session Supabase invalide. Reconnecte-toi.");
  }

  const headers={
    ...(options.headers||{}),
    Authorization:`Bearer ${session.access_token}`
  };

  if(options.body) headers["Content-Type"]="application/json";

  let result;

  }catch{
    throw new Error("Réponse invalide du serveur.");

async function loadCloud(){
 if(!ME)return;
 try{
  const [tr,profiles,rels]=await Promise.all([
   api('/api/trips'),
   api('/api/profiles'),
   api('/api/friendships')
  ]);

  T=(tr||[]).map(x=>({
   id:x.id,
   l:x.line_id,
   a:x.origin,
   b:x.destination,
   p:x.stations||[x.origin,x.destination],
   d:x.duration_seconds,
   k:x.distance_meters,
   t:new Date(x.travelled_at).getTime(),
   legs:Array.isArray(x.legs)&&x.legs.length?x.legs:null,
   co:Array.isArray(x.companions)?x.companions:[]
  }));

  PROF={};
  (profiles||[]).forEach(x=>{
   PROF[x.id]={
    pseudo:x.username||'Utilisateur',
    line:x.favorite_line||'1',
    station:x.favorite_station||'',
    share:!!x.share_stats,
    sum:x.stats||null
   };
  });

  REL=rels||[];
  FR=REL.filter(x=>x.status==='accepted')
   .map(x=>x.sender_id===ME.id?x.receiver_id:x.sender_id);

 }catch(e){
  console.error(e);
  G('msg').textContent='Impossible de charger les données : '+e.message;
  T=[];
  PROF={};
  REL=[];
  FR=[];
 }

 if(!ME.avatar&&PROF[ME.id]&&PROF[ME.id].sum)ME.avatar=safeImg(PROF[ME.id].sum.avatar);setHeaderAv();
 ME.badges=badgeIds(T);
 renderCmp();
 if(isTab('hist'))hist();
 if(isTab('st'))stats();
 if(isTab('fr'))renderFr();
}

async function saveMe(){const ps=G('ep').value.trim();if(ps.length<2){G('merr').textContent='Pseudo : 2 caractères minimum.';return}
ME.pseudo=ps;ME.line=favL;ME.station=G('es').value.trim();try{await persistProfile();setHeaderAv();G('merr').textContent='Profil enregistré ✔';if(isTab('fr')){await loadCloud();renderFr()}}catch(e){G('merr').textContent='Erreur : '+e.message}}

// ---------- Amis via Supabase ----------
let PROF={},FR=[],REL=[],FMSG='';
const code=()=>ME.pseudo+'#'+ME.id.slice(-4);
function frHTML(){
 if(viewF&&PROF[viewF]){const p=PROF[viewF];return `<button class="back" data-back="1">← Retour</button><div class="card pf">${avHTML(p.pseudo,p.sum&&p.sum.avatar,true)}<div><h2>${esc(p.pseudo)}</h2><span class="mut">Ligne préférée ${lgl(p.line)} · ${esc(p.station||'—')}</span></div></div>${lastTripCard(p.sum)}${badgesCard(p.sum&&p.sum.badges,false)}${statsHTML(p.sum)}`}
 const incoming=REL.filter(x=>x.status==='pending'&&x.receiver_id===ME.id),outgoing=REL.filter(x=>x.status==='pending'&&x.sender_id===ME.id);
 const mine=`<div class="card"><h2>Mon profil public</h2><div class="tog"><div>Partager mes stats avec mes amis<div class="mut">Ton code ami : <b>${esc(code())}</b></div></div><button class="sw ${ME.share?'on':''}" data-share="1" aria-label="Partager"></button></div><p class="mut sm">Active le partage pour apparaître dans la recherche d’amis.</p></div>`;
 const add=`<div class="card" style="--i:1"><h2>Ajouter un ami</h2><input id="fq" autocomplete="off" placeholder="Pseudo ou code ami (ex. Léa#a1b2)"><div id="fres"></div></div>`;
 const requests=`${incoming.length?`<div class="card"><h2>Demandes reçues</h2>${incoming.map(x=>{const p=PROF[x.sender_id]||{pseudo:'Utilisateur'};return `<div class="row"><div class="t">${avHTML(p.pseudo,p.sum&&p.sum.avatar)}<b>${esc(p.pseudo)}</b></div><button class="chips" style="margin:0" data-accept="${x.id}">Accepter</button><button class="x" data-reject="${x.id}">✕</button></div>`}).join('')}</div>`:''}${outgoing.length?`<div class="card"><h2>Demandes envoyées</h2>${outgoing.map(x=>`<p class="mut">En attente de réponse…</p>`).join('')}</div>`:''}`;
 const list=`<div class="card" style="--i:2"><h2>Mes amis</h2>${FR.length?FR.map(id=>{const p=PROF[id];return p?`<div class="row fr" data-f="${esc(id)}"><div class="t">${avHTML(p.pseudo,p.sum&&p.sum.avatar)}<div><b>${esc(p.pseudo)}</b><span class="mut">${p.sum&&p.sum.n?p.sum.n+' trajets · '+Math.round(p.sum.m/60)+' h':'Pas encore de trajet'}</span></div></div>${lgl(p.line)}<button class="x" data-rf="${esc(id)}" aria-label="Retirer">✕</button></div>`:''}).join(''):'<p class="mut">Pas encore d’ami : cherche un pseudo ci-dessus.</p>'}</div>`;
 return mine+add+requests+list+(FMSG?`<p class="err">${esc(FMSG)}</p>`:'')}
function renderRes(){const e=G('fres');if(!e)return;const q=(G('fq').value||'').trim().toLowerCase();if(q.length<2){e.innerHTML='';return}
const r=Object.entries(PROF).filter(([id,p])=>id!==ME.id&&p.pseudo&&(p.pseudo.toLowerCase().includes(q)||(p.pseudo+'#'+id.slice(-4)).toLowerCase()===q)).slice(0,8);
e.innerHTML=r.length?r.map(([id,p])=>{const rel=REL.find(x=>(x.sender_id===ME.id&&x.receiver_id===id)||(x.receiver_id===ME.id&&x.sender_id===id));const label=FR.includes(id)?'<span class="mut">Déjà ami</span>':rel?.status==='pending'?'<span class="mut">Demande en attente</span>':`<button class="chips" style="margin:0;border:0;background:none" data-af="${esc(id)}"><span style="padding:8px 13px;border-radius:99px;background:var(--g);color:#fff">Ajouter</span></button>`;return `<div class="row"><div class="t">${avHTML(p.pseudo,p.sum&&p.sum.avatar)}<div><b>${esc(p.pseudo)}</b><span class="mut">#${esc(id.slice(-4))}</span></div></div>${label}</div>`}).join(''):'<p class="mut">Aucun profil partagé trouvé. Ton ami doit activer le partage de son profil.</p>'}
function renderFr(anm){const keep=G('fq')?G('fq').value:'';G('frb').innerHTML=frHTML();if(G('fq')){G('fq').value=keep;renderRes()}if(anm&&viewF)anim(G('frb'))}

async function sendFriendRequest(id){
 try{
  await api('/api/friendships',{
   method:'POST',
   body:JSON.stringify({receiver_id:id})
  });
  FMSG='Demande envoyée !';
 }catch(e){
  FMSG=e.message;
 }
 await loadCloud();
 renderFr();
}

async function answerFriendRequest(id,status){
 try{
  await api('/api/friendships/'+encodeURIComponent(id),{
   method:'PATCH',
   body:JSON.stringify({status})
  });
 }catch(e){
  FMSG=e.message;
 }
 await loadCloud();
 renderFr();
}

async function removeFriend(id){
 try{
  await api('/api/friendships?friend_id='+encodeURIComponent(id),{
   method:'DELETE'
  });
 }catch(e){
  FMSG=e.message;
 }
 await loadCloud();
 renderFr();
}

// ---------- Navigation ----------
const TABS=[['go','🚇','Trajet'],['hist','📒','Historique'],['st','📊','Stats'],['fr','👥','Amis'],['me','🙂','Profil']];let tab='go';
const isTab=t=>tab==t;
function show(t){tab=t;chg=null;G('p-chg').classList.add('hide');TABS.forEach(x=>G('p-'+x[0]).classList.toggle('hide',x[0]!=t));
G('nav').innerHTML=TABS.map(x=>`<button data-t="${x[0]}" class="${x[0]==t?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');
if(t=='go'){renderLines();renderItin();renderCmp()}if(t=='hist')hist();if(t=='st')stats();if(t=='fr'){viewF=null;renderFr()}if(t=='me')showMe()}

document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let n;
if(n=c('[data-yes]')){const f=pend;closeAsk();if(f)f()}
else if(c('[data-no]')||t.id=='modal')closeAsk();
else if(n=c('[data-t]'))show(n.dataset.t);
else if(n=c('[data-am]')){authMode=n.dataset.am;showAuth()}
else if(c('[data-auth]'))doAuth();
else if(n=c('[data-fl]')){favL=n.dataset.fl;document.querySelectorAll('[data-fl]').forEach(b=>b.classList.toggle('sel',b.dataset.fl==favL))}
else if(c('[data-saveme]'))saveMe();
else if(c('[data-logout]')){sb.auth.signOut().then(()=>{ME=null;T=[];authMode='login';showAuth()})}
else if(c('[data-dd]')){isOpen=!isOpen;renderLines()}
else if(n=c('[data-l]')){cur=n.dataset.l;isOpen=false;if(!legs.length)G('a').value='';G('b').value='';G('msg').textContent='';renderLines()}
else if(n=c('[data-p]')){G(n.dataset.p).value=n.dataset.v;hideSug()}
else if(c('[data-swap]')){const a=G('a').value;G('a').value=G('b').value;G('b').value=a}
else if(c('[data-add]'))add();

else if(n=c('[data-del]')){
 const i=+n.dataset.del;
 ask('Supprimer ce trajet de ton historique ?',async()=>{
  const x=T[i];
  if(x?.id){
   try{
    await api('/api/trips/'+encodeURIComponent(x.id),{
     method:'DELETE'
    });
   }catch(error){
    G('msg').textContent=error.message;
    return;
   }
  }
  T.splice(i,1);
  await save();
  hist();
 });
}

else if(n=c('[data-sort]')){sortBy=n.dataset.sort;hist()}
else if(n=c('[data-per]')){per=+n.dataset.per;stats()}
else if(c('[data-share]')){ME.share=!ME.share;FMSG='';persistProfile().then(()=>loadCloud()).then(()=>renderFr()).catch(e=>{FMSG=e.message;ME.share=!ME.share;renderFr()})}
else if(n=c('[data-af]')){sendFriendRequest(n.dataset.af)}
else if(n=c('[data-accept]')){answerFriendRequest(n.dataset.accept,'accepted')}
else if(n=c('[data-reject]')){answerFriendRequest(n.dataset.reject,'rejected')}
else if(n=c('[data-rf]')){const id=n.dataset.rf;ask('Retirer cet ami de ta liste ?',()=>removeFriend(id),'Retirer')}
else if(n=c('[data-f]')){viewF=n.dataset.f;renderFr(true)}
else if(c('[data-back]')){viewF=null;renderFr()}
else if(c('[data-chg]'))chgStart();
else if(c('[data-undo]'))undoLeg();
else if(n=c('[data-cl]'))chooseLine(n.dataset.cl);
else if(c('[data-cl-all]')){chg.all=true;renderChg()}
else if(n=c('[data-cf]')){const id=n.dataset.cf,i=comp.findIndex(x=>x.f==id);if(i>=0)comp.splice(i,1);else comp.push({n:PROF[id].pseudo,f:id});renderCmp()}
else if(c('[data-cadd]'))addComp();
else if(n=c('[data-cx]')){comp.splice(+n.dataset.cx,1);renderCmp()}
else if(n=c('[data-badge]'))showBadge(n.dataset.badge,n.dataset.own==='1');
else if(c('[data-pick]')){const f=G('avf');if(f)f.click()}
else if(c('[data-rmav]'))setAvatar('');
else if(!c('.fld'))hideSug()});
document.addEventListener('change',async e=>{if(e.target&&e.target.id=='avf'){const f=e.target.files&&e.target.files[0];if(!f)return;try{await setAvatar(await resizeAvatar(f))}catch(err){G('merr').textContent='Photo : '+err.message}e.target.value=''}});
['input','focusin'].forEach(ev=>document.addEventListener(ev,e=>{const id=e.target.id;if(id=='fq'){renderRes();return}if(['a','b','rs','es'].includes(id)){hideSug();if(id=='a'&&legs.length)return;sug(id)}}));
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeAsk();if(e.key=='Enter'&&e.target&&e.target.id=='co'){e.preventDefault();addComp()}});

// ---------- Fond : plan de métro stylisé ----------
const MAP=[['#FFCE00',[[-20,150],[110,250],[200,330],[330,420],[420,560]]],['#0064B1',[[-20,520],[90,420],[200,330],[300,230],[420,190]]],['#C04191',[[60,-20],[110,120],[200,330],[230,470],[300,600],[330,820]]],['#00814F',[[-20,700],[120,640],[230,470],[420,430]]],['#62259D',[[-20,330],[110,250],[180,130],[260,-20]]],['#F28E42',[[400,-20],[330,120],[300,230],[230,470],[110,780]]]];
let svg='<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><path d="M-20 360 C90 300 140 470 250 400 S380 330 420 380" fill="none" stroke="#9fd0ee" stroke-width="18" opacity=".7"/><g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">';
MAP.forEach(m=>{svg+=`<polyline stroke="${m[0]}" points="${m[1].map(p=>p.join(',')).join(' ')}"/>`});
svg+='</g><g fill="#fff" stroke="#222" stroke-width="2.5">';
MAP.forEach(m=>m[1].forEach((p,i,a)=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`;if(a[i+1])svg+=`<circle cx="${(p[0]+a[i+1][0])/2}" cy="${(p[1]+a[i+1][1])/2}" r="4"/>`}));
G('bg').innerHTML=svg+'</g></svg>';G('lgh').innerHTML=logoSvg();

(async()=>{try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await enter(data.session.user);else showAuth()}catch(err){showAuth('Erreur de connexion : '+err.message)}})();

</script></body></html>
