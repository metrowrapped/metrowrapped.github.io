html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif}

header h1{font-size:18px;margin:0}header small{opacity:.85;display:block;font-size:12px}
.logo{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--g);font-weight:800;display:grid;place-items:center;font-size:20px}
main{padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(4px)}
h2{font-size:15px;margin:0 0 10px;color:var(--g)}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
button,input{font:inherit;color:var(--tx)}
.chips button{padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:transparent;font-size:14px}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
#lines{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.lb{background:none;border:2px solid transparent;border-radius:14px;padding:3px;display:grid;place-items:center}.lb.sel{border-color:var(--g);background:#00855a22}
.lg{display:inline-grid;place-items:center;width:36px;height:36px;background:var(--c);font:800 17px/1 system-ui;font-style:normal;position:relative}
.lg.m{border-radius:50%}.lg.sq{border-radius:9px}.lg sub{position:absolute;bottom:2px;font-size:7px;font-weight:700}
.lg.sm{width:26px;height:26px;font-size:12px}.lg.sm sub{font-size:5px;bottom:1px}
#cur{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.fld{position:relative}.sg{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--card);border:1px solid var(--bd);border-radius:12px;max-height:38vh;overflow:auto;box-shadow:0 8px 20px #0003;backdrop-filter:blur(6px)}.sg:empty{display:none}
.sg div{padding:11px 12px;border-bottom:1px solid var(--bd)}
.swap{display:block;margin:8px auto 0;background:none;border:1px solid var(--bd);border-radius:99px;padding:5px 14px;font-size:13px}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:16px}
.mut{color:var(--mut);font-size:13px}.hide{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{display:flex;gap:10px;align-items:center}.x{background:none;border:0;font-size:18px;color:var(--mut);padding:6px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;border-left:5px solid var(--g)}
.st b{display:block;font-size:19px;overflow-wrap:anywhere}.st span{font-size:12px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;max-width:480px;margin:0 auto;background:var(--g);padding-bottom:env(safe-area-inset-bottom,0px)}

.dd{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:2px solid var(--g);background:var(--card)}
#ddp{margin-top:8px;border:1px solid var(--bd);border-radius:14px;max-height:50vh;overflow:auto;background:var(--card)}
.gh{position:sticky;top:0;background:var(--g);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;letter-spacing:.5px}
.opt{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--bd)}.opt.sel{background:#00855a22;font-weight:700}

Object.entries(NET).forEach(([id,v])=>{let l=line(id);if(!l){l=[id,v[0],v[1],''];L.push(l)}else if(v[0]&&l[2]!='Métro')l[1]=v[0];l[3]=v[2];l[4]=v[3];l[5]=v[4]});
const MODES=['Métro','RER','Transilien','Tramway'];

const NM={'Métro':'Métro ','RER':'RER ','Transilien':'Transilien ','Tramway':'Tramway '};
let isOpen=false;
function renderLines(){
const l=line(cur),n=all(l).length;
G('cur').innerHTML=`${logo(l)}<span style="flex:1;text-align:left"><b>${NM[l[2]]}${l[0]}</b><span class="mut" style="display:block">${n?n+' stations':'Stations pas encore chargées : saisie libre'}</span></span><span>${isOpen?'▲':'▼'}</span>`;
G('ddp').classList.toggle('hide',!isOpen);
G('ddp').innerHTML=isOpen?MODES.map(m=>`<div class="gh">${m.toUpperCase()}</div>`+L.filter(x=>x[2]==m).map(x=>`<div class="opt ${x[0]==cur?'sel':''}" data-l="${x[0]}">${logo(x,1)}<span>${NM[m]}${x[0]}</span></div>`).join('')).join(''):''}

function sug(k){const s=all(line(cur)),q=nz(G(k).value),r=(q?s.filter(x=>nz(x).includes(q)):s).slice(0,60);
G('s'+k).innerHTML=r.map(x=>`<div data-p="${k}" data-v="${x.replace(/"/g,'&quot;')}">${x}</div>`).join('')}
const hideSug=()=>{G('sa').innerHTML='';G('sb').innerHTML=''};

const tab2=(l,k)=>l[k]?l[k].split(';').map(v=>v.split(',').map(Number)):[];
function path(l,a,b){const V=vars(l),Tm=tab2(l,4),Dm=tab2(l,5);let best=null;
V.forEach((v,n)=>{const i=v.indexOf(a),j=v.indexOf(b);if(i>=0&&j>=0&&i!=j&&(!best||Math.abs(i-j)<best.s))best={n,i,j,s:Math.abs(i-j)}});
if(!best)return{p:[a,b],d:null,k:null};
const{n,i,j}=best,lo=Math.min(i,j),hi=Math.max(i,j),p=V[n].slice(lo,hi+1);if(i>j)p.reverse();
const sum=A=>A&&A.length?A.slice(lo,hi).reduce((x,y)=>x+y,0):null;return{p,d:sum(Tm[n]),k:sum(Dm[n])}}
function add(){const l=line(cur),a=G('a').value.trim(),b=G('b').value.trim(),s=all(l);
if(!a||!b||a==b){G('msg').textContent='Choisis deux stations différentes.';return}
if(l[2]=='Métro'&&(!s.includes(a)||!s.includes(b))){G('msg').textContent='Station inconnue sur cette ligne : choisis-la dans la liste.';return}
const q=path(l,a,b),p=q.p;T.push({l:cur,a,b,p,d:q.d,k:q.k,t:new Date(G('d').value||Date.now()).getTime()});save();
G('msg').textContent=`Enregistré ✔ ${p.length-1} arrêt(s)${q.d?' · '+Math.round(q.d/60)+' min':''}`;G('a').value=G('b').value='';G('d').value=nowLocal();hideSug()}

function hist(){G('hist').innerHTML=T.length?T.map((x,i)=>[x,i]).sort((u,v)=>v[0].t-u[0].t).map(([x,i])=>`<div class="row"><div class="t">${logo(line(x.l),1)}<div>${x.a} → ${x.b}<div class="mut">${new Date(x.t).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})} · ${x.p.length-1} arrêts${x.d?' · '+Math.round(x.d/60)+' min':''}</div></div></div><button class="x" data-del="${i}">✕</button></div>`).join(''):'<p class="mut">Aucun trajet pour l’instant.</p>'}

const best=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0];
function stats(){G('pers').innerHTML=[[0,'Tout'],[7,'7 jours'],[30,'30 jours'],[365,'12 mois']].map(p=>`<button data-per="${p[0]}" class="${p[0]==per?'on':''}">${p[1]}</button>`).join('');
const min=per?Date.now()-per*864e5:0,R=T.filter(x=>x.t>=min);
if(!R.length){G('stats').innerHTML='<p class="mut">Pas de trajet sur cette période.</p>';return}
const lc={},sc={},tc={};let hops=0,lg=R[0];
R.forEach(x=>{lc[x.l]=(lc[x.l]||0)+1;x.p.forEach(s=>sc[s]=(sc[s]||0)+1);tc[x.b]=(tc[x.b]||0)+1;hops+=x.p.length-1;if(x.p.length>lg.p.length)lg=x});
let sd=0,sk=0;R.forEach(x=>{sd+=x.d||(x.p.length-1)*108;sk+=(x.k||(x.p.length-1)*750)/1000});const m=Math.round(sd/60),km=sk,tl=best(lc),ts=best(sc),td=best(tc);
const h=m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
const C=[[R.length,'trajets'],[Object.keys(sc).length,'stations différentes visitées'],[h,'dans les transports (horaires théoriques IDFM)'],[km.toFixed(0)+' km','parcourus (à vol d’oiseau entre stations)'],
[logo(line(tl[0]),1)+' '+tl[1]+'×','ta ligne n°1'],[ts[0]+' ('+ts[1]+'×)','ta station reine'],[td[0],'ta destination favorite'],[Object.keys(lc).length+' lignes','testées'],
[lg.a+' → '+lg.b,'ton plus long trajet ('+(lg.p.length-1)+' arrêts)'],[(m/20).toFixed(1),'épisodes de 20 min vus à la place 📺'],[(km/0.33).toFixed(0)+'×','la tour Eiffel couchée à l’horizontale 🗼'],[(m/14.4).toFixed(1)+' %','d’une journée entière dans les transports']];
G('stats').innerHTML=C.map(c=>`<div class="st"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')}

function show(t){tab=t;['go','hist','st'].forEach(k=>G('p-'+k).classList.toggle('hide',k!=t));
G('nav').innerHTML=[['go','🚇','Trajet'],['hist','📒','Historique'],['st','📊','Stats']].map(x=>`<button data-t="${x[0]}" class="${x[0]==t?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('');
if(t=='hist')hist();if(t=='st')stats()}

document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest&&t.closest(s);let n;
if(n=c('[data-t]'))show(n.dataset.t);
else if(c('[data-dd]')){isOpen=!isOpen;renderLines()}
else if(n=c('[data-l]')){cur=n.dataset.l;isOpen=false;G('a').value=G('b').value='';G('msg').textContent='';renderLines()}
else if(n=c('[data-p]')){G(n.dataset.p).value=n.dataset.v;hideSug()}
else if(c('[data-swap]')){const a=G('a').value;G('a').value=G('b').value;G('b').value=a}
else if(c('[data-add]'))add();
else if(n=c('[data-del]')){T.splice(+n.dataset.del,1);save();hist()}
else if(n=c('[data-per]')){per=+n.dataset.per;stats()}
else if(!c('.fld'))hideSug()});
['input','focusin'].forEach(ev=>document.addEventListener(ev,e=>{const id=e.target.id;if(id=='a'||id=='b'){hideSug();sug(id)}}));

MAP.forEach(m=>m[1].forEach((p,i,a)=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="5"/>`;if(a[i+1])svg+=`<circle cx="${(p[0]+a[i+1][0])/2}" cy="${(p[1]+a[i+1][1])/2}" r="4"/>`}));

try{G('d').value=nowLocal();renderLines();show('go')}catch(e){G('msg').textContent='Erreur : '+e.message}
